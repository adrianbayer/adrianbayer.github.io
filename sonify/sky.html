<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky Explorer &mdash; Multi-Probe Sky</title>
<style>
:root{
  --bg:#0a0e1a; --panel:#131829; --border:#1e2744; --text:#c8cde0; --muted:#8a93b4; --accent:#4a9eff; --focus:#ffd58a;
  --cmb:#4a9eff; --tsz:#ff9f43; --cib:#2ed573; --ksz:#b86bff; --tot:#ebebeb;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column;}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 14px;border-bottom:1px solid var(--border);}
header h1{font-size:1.05em;font-weight:600;color:#e8ecf4;}
header .sub{font-size:0.78em;color:var(--muted);}
a.back{color:var(--accent);text-decoration:none;font-size:0.82em;border:1px solid var(--border);padding:4px 10px;border-radius:6px;}
a.back:hover{background:#1e2744;}
.controls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:6px 14px;border-bottom:1px solid var(--border);}
.cgroup{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;}
.clabel{font-size:0.68em;text-transform:uppercase;letter-spacing:0.6px;color:var(--muted);}
.btn{padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text);cursor:pointer;font-size:0.8em;}
.btn.active{background:var(--accent);color:var(--bg);border-color:var(--accent);}
.btn:hover{filter:brightness(1.15);}
.btn.mini{padding:1px 5px;font-size:0.68em;border-radius:4px;}
.btn.mini.active.mute{background:#cc3333;border-color:#cc3333;color:#fff;}
.btn.mini.active.solo{background:#e0b030;border-color:#e0b030;color:#06101f;}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
select{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:0.8em;padding:3px 4px;}
.comp{display:inline-flex;align-items:center;gap:2px;}
.comp-btn{border-width:2px;}
.comp-btn[data-comp="dT_cmblens"]{border-color:var(--cmb);} .comp-btn[data-comp="dT_cmblens"].active{background:var(--cmb);color:#06101f;}
.comp-btn[data-comp="dT_tsz"]{border-color:var(--tsz);} .comp-btn[data-comp="dT_tsz"].active{background:var(--tsz);color:#06101f;}
.comp-btn[data-comp="dT_cib"]{border-color:var(--cib);} .comp-btn[data-comp="dT_cib"].active{background:var(--cib);color:#06101f;}
.comp-btn[data-comp="dT_ksz"]{border-color:var(--ksz);} .comp-btn[data-comp="dT_ksz"].active{background:var(--ksz);color:#06101f;}
.comp-btn[data-comp="T_tot"]{border-color:var(--tot);} .comp-btn[data-comp="T_tot"].active{background:var(--tot);color:#06101f;}
.freq-group{display:flex;align-items:center;gap:3px;padding:2px 6px;border:1px solid var(--border);border-radius:6px;}
.freq-group .clabel{margin-right:2px;}
.note{font-size:0.74em;color:var(--muted);padding:4px 14px;border-bottom:1px solid var(--border);}
.note b{color:var(--text);font-weight:600;}
.note .warn{color:#ffb86b;}
#wrap{position:relative;flex:1;min-height:0;}
#map,#overlay{position:absolute;inset:0;display:block;width:100%;height:100%;}
#map{cursor:grab;touch-action:none;background:#04060c;}
#map.grabbing{cursor:grabbing;}
#map.scan{cursor:cell;}
#map:focus-visible{outline:2px solid var(--focus);outline-offset:-2px;}
#overlay{pointer-events:none;}
.readout{position:absolute;left:10px;bottom:10px;font-size:0.75em;color:#aab3d4;background:rgba(4,6,12,0.8);
  padding:4px 8px;border-radius:6px;pointer-events:none;max-width:calc(100% - 20px);}
.readout b{color:var(--accent);font-weight:600;}
.hint{position:absolute;right:10px;top:10px;font-size:0.72em;color:var(--muted);background:rgba(4,6,12,0.8);
  padding:4px 8px;border-radius:6px;pointer-events:none;max-width:46%;text-align:right;}
.hint:empty{padding:0;background:none;}   /* stays in the accessibility tree (role=status) */
.key{position:absolute;right:10px;top:10px;width:min(420px,calc(100% - 20px));max-height:calc(100% - 60px);overflow:auto;
  font-size:0.74em;line-height:1.45;background:rgba(10,14,26,0.95);border:1px solid var(--border);border-radius:8px;padding:10px 12px;z-index:3;}
.key h2{font-size:1.05em;color:#e8ecf4;margin:0 0 4px;}
.key h3{font-size:0.95em;color:#e8ecf4;margin:8px 0 2px;}
.key table{border-collapse:collapse;width:100%;}
.key td,.key th{border-bottom:1px solid var(--border);padding:2px 4px;text-align:left;vertical-align:top;}
.key th{color:var(--muted);font-weight:normal;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
input[type=range]{accent-color:var(--accent);}
</style>
</head>
<body>

<header>
  <h1>Sky Explorer</h1>
  <span class="sub">drag to pan &middot; wheel/buttons to zoom &middot; click to listen &middot; keyboard: focus the map, arrows move the ear</span>
  <a class="back" href="index.html">&larr; All toys</a>
  <a class="back" href="globe.html">3D globe</a>
  <a class="back" href="sonifier.html">Sonifier</a>
  <a class="back" href="about.html">How it works</a>
</header>

<div class="controls" role="group" aria-label="Sky Explorer controls">
  <div class="cgroup" id="compGroup">
    <span class="clabel" title="Toggle components: the map overlays them and the audio has one voice each. M = mute, S = solo (audio only)">Components</span>
  </div>
  <div class="cgroup" id="bandGroup"><span class="clabel">Band (GHz)</span></div>
  <div class="cgroup">
    <span class="clabel">Zoom</span>
    <button class="btn" id="zoomOut" aria-label="Zoom out">&minus;</button>
    <button class="btn" id="zoomIn" aria-label="Zoom in">+</button>
    <button class="btn" id="zoomReset">whole sky</button>
  </div>
  <div class="cgroup">
    <span class="clabel">Audio</span>
    <button class="btn" id="scanBtn" aria-pressed="false" title="Drag (or use the arrow keys) to move a continuous 'ear' along a path">Scan</button>
    <button class="btn" id="refBtn" aria-pressed="false" title="Play each voice's centre pitch (the empty-sky level when equalized per map, 0 µK in the physical scales) as a reference">Ref tone</button>
    <button class="btn active" id="eqBtn" aria-pressed="true" title="ISO 226 (60 phon) equal-loudness weighting of each voice's fundamental">Equal loudness</button>
    <label class="clabel" for="scaleSel">Scale</label>
    <select id="scaleSel" title="How dT maps to pitch and loudness (see the Sound key)">
      <option value="map" selected>equalized per map</option>
      <option value="component">physical per component</option>
      <option value="common">common &micro;K (physical)</option>
    </select>
  </div>
  <div class="cgroup">
    <label class="clabel" for="haloSel">Halo sound</label>
    <select id="haloSel" title="Data halo sound (a bell): mass sets pitch, distance sets level/brightness/reverb. Artistic: a 'hey!' or your recorded clip">
      <option value="data" selected>data (bell)</option>
      <option value="artistic">artistic ('hey!' / your clip)</option>
    </select>
    <button class="btn" id="haloRecBtn" title="Record a short clip (up to 3 s) for the artistic halo sound">&#127908; record</button>
    <label class="clabel" for="vol">Vol</label>
    <input type="range" id="vol" min="0" max="200" value="70" style="width:90px;" title="Default 70: the limiter stays idle at 99.9% of sky positions; louder settings may engage it on bright spots">
    <button class="btn" id="keyBtn" aria-expanded="false" aria-controls="key">Sound key</button>
  </div>
</div>
<div class="note" id="note">loading&hellip;</div>

<div id="wrap">
  <canvas id="map" tabindex="0" role="application"
    aria-label="Sky map. Arrow keys move the listening point (Shift for bigger steps), Enter or Space plays it, plus and minus zoom."></canvas>
  <canvas id="overlay" aria-hidden="true"></canvas>
  <div class="readout" id="readout" aria-hidden="true">&mdash;</div>
  <div class="hint" id="hint" role="status" aria-live="polite"></div>
  <aside class="key" id="key" hidden aria-label="Sound key"></aside>
  <div class="sr-only" id="live" aria-live="polite"></div>
</div>

<script src="sonify_core.js"></script>
<script src="sky_core.js"></script>
<script src="sky_audio.js"></script>
<script>
'use strict';
if (typeof SkyCore === 'undefined' || typeof SkyAudio === 'undefined') {
  document.getElementById('hint').textContent = 'Could not load the page scripts (sonify_core.js, sky_core.js, sky_audio.js).';
  throw new Error('sky page scripts missing');
}
const C = SkyCore;
const audio = SkyAudio.createSkyAudio({ volume: 0.7 });
const COMPS = ['dT_cmblens', 'dT_tsz', 'dT_cib', 'dT_ksz', 'T_tot'];
const DRAW_ORDER = ['dT_cmblens', 'T_tot', 'dT_ksz', 'dT_tsz', 'dT_cib'];   // background-like first, emission on top
const PICK_PX = 6, PICK_PX_TOUCH = 14;        // halo pick radius in CSS pixels (zoom-aware angle)
const SCAN_PX = 5;                             // scan sample spacing in CSS pixels at the current zoom
const KEY_STEP_PX = 8;
const CLICK_SLOP_PX = 4, CLICK_SLOP_PX_TOUCH = 10;   // total pointer travel [CSS px] that turns a click into a drag
const SCAN_QUEUE = 60;                          // max scan samples queued (bounded lag)
const V = {
  meta: null, halos: null, hidx: null, store: null, scales: null,
  dispW: 4096, dispH: 2048,
  scale: 1, minScale: 1, maxScale: 2, panX: 0, panY: 0, cw: 0, ch: 0,
  comps: ['dT_cmblens'], band: '143', scaleMode: C.DEFAULT_SCALE_MODE,
  layers: {}, mute: new Set(), solo: new Set(),
  dragging: false, moved: false, lastX: 0, lastY: 0, downX: 0, downY: 0, touch: false,
  scan: false, path: null, ear: null, haloLast: new Map(), keyTimer: null, lastKeyPlay: 0,
};
const canvas = document.getElementById('map'), ctx = canvas.getContext('2d');
const ov = document.getElementById('overlay'), octx = ov.getContext('2d');
const $ = (id) => document.getElementById(id);

// ============================== geometry / view ==============================
function pxPerRad() { return V.dispH * V.scale / Math.PI; }
function recomputeScaleLimits() {
  V.minScale = Math.min(V.cw / V.dispW, V.ch / V.dispH);   // zoomed out = whole sky fits
  V.maxScale = Math.max(V.minScale, 2);                    // 2 CSS px per display pixel
}
function resize() {
  const r = $('wrap').getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  for (const c of [canvas, ov]) { c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); octx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const first = !V.cw;
  V.cw = r.width; V.ch = r.height;
  recomputeScaleLimits();
  if (first) { V.scale = V.minScale; V.panX = (V.cw - V.dispW * V.scale) / 2; }
  clampView(); draw();
}
function clampView() {
  V.scale = Math.min(V.maxScale, Math.max(V.minScale, V.scale));
  const sH = V.dispH * V.scale;
  if (sH <= V.ch) V.panY = (V.ch - sH) / 2;
  else V.panY = Math.min(0, Math.max(V.ch - sH, V.panY));
}
/** Screen (CSS px) -> sky. Longitude wraps; outside the map in latitude -> null. */
function screenToSky(sx, sy) {
  const fx = (sx - V.panX) / (V.dispW * V.scale), fy = (sy - V.panY) / (V.dispH * V.scale);
  if (fy < 0 || fy > 1) return null;
  return C.imgFracToSky(fx - Math.floor(fx), fy);
}
/** Sky -> screen x positions (all wrapped copies on screen) and y. */
function skyToScreen(theta, phi) {
  const f = C.skyToImgFrac(theta, phi), sW = V.dispW * V.scale;
  let x = V.panX + f.fx * sW; x -= Math.ceil(x / sW) * sW;
  const xs = []; for (; x < V.cw + sW; x += sW) if (x > -sW) xs.push(x);
  return { xs, y: V.panY + f.fy * V.dispH * V.scale };
}

// ============================== display layers ==============================
function displayFiles(comp) {
  const e = C.findMap(V.meta, comp, V.band); if (!e) return null;
  const d = e.display, multi = V.comps.length >= 2;
  return (multi && d.hi_dk) ? { hi: d.hi_dk, lo: d.lo_dk } : { hi: d.hi, lo: d.lo };
}
function layerImg(files) { const L = files && V.layers[files.hi]; return L ? (L.hi || L.lo) : null; }
function ensureLayers() {
  for (const c of V.comps) {
    const f = displayFiles(c); if (!f) continue;
    let L = V.layers[f.hi];
    if (!L) L = V.layers[f.hi] = { lo: null, hi: null, loLoading: false, hiLoading: false };
    if (!L.lo && !L.loLoading) {
      L.loLoading = true;
      const im = new Image();
      im.onload = () => { L.lo = im; draw(); loadHi(f, L); updateHint(); };
      im.onerror = () => { L.loLoading = false; };
      im.src = 'sky_img/' + f.lo;
    } else if (!L.hi && !L.hiLoading) loadHi(f, L);
  }
  updateHint();
}
function loadHi(f, L) {
  if (L.hi || L.hiLoading) return;
  L.hiLoading = true;
  const im = new Image();
  im.onload = () => { L.hi = im; draw(); };
  im.onerror = () => { L.hiLoading = false; };
  im.src = 'sky_img/' + f.hi;
}
function setHint(t) { if ($('hint').textContent !== t) $('hint').textContent = t; }   // a live region: announce changes only
function updateHint() {
  const missing = V.comps.some((c) => !layerImg(displayFiles(c)));
  const failed = V.comps.map((c) => V.store.error(c, V.band)).find(Boolean);
  const vm = V.comps.some((c) => !V.store.isReady(c, V.band));
  setHint(failed ? 'sky values unavailable: ' + failed.message : missing ? 'loading images…' : vm ? 'loading sky values…' : '');
}

// ============================== draw ==============================
function draw() {
  if (!V.cw || !V.meta) return;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#04060c'; ctx.fillRect(0, 0, V.cw, V.ch);
  const sW = V.dispW * V.scale, sH = V.dispH * V.scale;
  let baseX = V.panX % sW; if (baseX > 0) baseX -= sW;
  ctx.imageSmoothingEnabled = true;
  // single component -> classic colormap; overlay -> dark-centred variants combined by per-channel
  // max ('lighten') so the composite never washes to white
  const multi = V.comps.length >= 2;
  for (const c of DRAW_ORDER) {
    if (V.comps.indexOf(c) < 0) continue;
    const img = layerImg(displayFiles(c)); if (!img) continue;
    ctx.globalCompositeOperation = multi ? 'lighten' : 'source-over';
    for (let x = baseX; x < V.cw; x += sW) ctx.drawImage(img, x, V.panY, sW, sH);
  }
  ctx.globalCompositeOperation = 'source-over';
  drawHalos(baseX, sW, sH);
  drawOverlay();
}
function drawHalos(baseX, sW, sH) {
  if (!V.halos) return;
  const H = V.halos;
  for (let i = 0; i < H.n; i++) {
    const y = V.panY + (H.theta[i] / 180) * sH;
    if (y < -4 || y > V.ch + 4) continue;
    const ix = (H.phi[i] / 360) * sW, logM = H.log_mass[i];
    const sz = Math.max(1.2, (logM - 14.5) * 3.2);           // radius grows with log M
    for (let x = baseX + ix; x < V.cw + sz; x += sW) {
      if (x < -sz) continue;
      ctx.globalAlpha = Math.min(0.8, (logM - 14.5) * 0.7 + 0.2);
      ctx.fillStyle = '#ffd58a';
      ctx.beginPath(); ctx.arc(x, y, sz, 0, 2 * Math.PI); ctx.fill();
      if (logM > 15.0) { ctx.globalAlpha = 0.9; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, y, sz + 1, 0, 2 * Math.PI); ctx.stroke(); }
    }
  }
  ctx.globalAlpha = 1;
}
function niceStep(pxPerDeg) {
  for (const s of [1, 2, 5, 10, 15, 30, 45, 60, 90]) if (s * pxPerDeg >= 70) return s;
  return 90;
}
function drawOverlay() {
  octx.clearRect(0, 0, V.cw, V.ch);
  if (!V.meta) return;
  // coordinate labels: simulation (theta, phi), theta = 0 at the top, phi increasing to the right
  const ppd = pxPerRad() * C.DEG, step = niceStep(ppd);
  octx.font = '11px system-ui,sans-serif'; octx.textBaseline = 'top';
  octx.fillStyle = 'rgba(200,205,224,0.85)'; octx.strokeStyle = 'rgba(200,205,224,0.5)'; octx.lineWidth = 1;
  const top = Math.max(0, V.panY);
  for (let p = 0; p < 360; p += step) {
    for (const x of skyToScreen(Math.PI / 2, p * C.DEG).xs) {
      if (x < 0 || x > V.cw - 30) continue;
      octx.beginPath(); octx.moveTo(x, top); octx.lineTo(x, top + 6); octx.stroke();
      octx.fillText('φ=' + p + '°', x + 2, top + 2);
    }
  }
  octx.textBaseline = 'middle';
  for (let t = step; t < 180; t += step) {
    const y = V.panY + t / 180 * V.dispH * V.scale;
    if (y < 14 || y > V.ch - 30) continue;
    octx.beginPath(); octx.moveTo(0, y); octx.lineTo(6, y); octx.stroke();
    octx.fillText('θ=' + t + '°', 8, y);
  }
  // the ear (listening point)
  if (V.ear) {
    const s = skyToScreen(V.ear.theta, V.ear.phi);
    octx.strokeStyle = '#ffffff'; octx.lineWidth = 2;
    for (const x of s.xs) {
      octx.beginPath(); octx.arc(x, s.y, 7, 0, 2 * Math.PI); octx.stroke();
      octx.beginPath(); octx.arc(x, s.y, 1.5, 0, 2 * Math.PI); octx.fillStyle = '#fff'; octx.fill();
    }
    // the pending scan path (where the ear will go)
    if (V.path && V.path.pending) {
      octx.fillStyle = 'rgba(255,255,255,0.55)';
      for (const q of V.path.queue) {
        const p = skyToScreen(q.theta, q.phi);
        for (const x of p.xs) octx.fillRect(x - 1, p.y - 1, 2, 2);
      }
    }
  }
}

// ============================== value maps + audio ==============================
function orderedComps() { return C.VOICE_ORDER.filter((c) => V.comps.indexOf(c) >= 0); }
/** One voice sample per active component at (theta, phi) (SkyCore.voiceSample): uK = the value
 *  (null until its map is loaded), and the pitch centre/scales of the current Scale mode and band. */
function samplesAt(theta, phi) {
  return orderedComps().map((c) => {
    const m = V.store.get(c, V.band);
    return C.voiceSample(c, m ? C.sampleMap(m, theta, phi) : null, C.findMap(V.meta, c, V.band), V.scales[c]);
  });
}
function updateScales() { V.scales = C.scaleTable(V.meta, V.band, V.scaleMode); }
function loadValueMaps() { for (const c of V.comps) V.store.get(c, V.band); }
function haloAt(theta, phi, radiusPx) {
  if (!V.hidx) return null;
  return C.pickHalo(V.hidx, theta, phi, C.pickRadiusAngle(radiusPx, pxPerRad()));
}
function haloText(p, verbose) {
  const H = V.halos, i = p.index;
  const s = 'cluster: log₁₀ M₂₀₀c = ' + H.log_mass[i].toFixed(2) + ' (M⊙/h), z = ' + H.redshift[i].toFixed(2) +
    (H.chi ? ', χ = ' + Math.round(H.chi[i]) + ' Mpc/h' : '');
  return verbose ? s + ', ' + (p.dist / C.DEG * 60).toFixed(1) + ' arcmin away' : s;
}
function playHaloIdx(i) {
  const H = V.halos;
  audio.playHalo({ logM: H.log_mass[i], chi: H.chi ? H.chi[i] : C.comovingDistance(H.redshift[i]) });
}
function valueText(s) {
  return s.uK !== null ? C.formatMicroK(s.uK, s.step) : V.store.error(s.comp, V.band) ? '(unavailable)' : '(loading)';
}
function valuesText(samples) { return samples.map((s) => C.COMP_LABELS[s.comp] + ' ' + valueText(s)).join(', '); }
function setReadout(sky, samples, halo) {
  let html = C.formatSkyCoords(sky.theta, sky.phi) + ' &nbsp;|&nbsp; ' +
    samples.map((s) => '<b style="color:var(--' + cssVar(s.comp) + ')">' + C.COMP_LABELS[s.comp] + '</b> ' +
      (s.uK === null ? '&hellip;' : C.formatMicroK(s.uK, s.step))).join(' &nbsp; ');
  if (halo) html += ' &nbsp;|&nbsp; <span style="color:#ffd58a">&#9679; ' + haloText(halo, false) + '</span>';
  $('readout').innerHTML = html;
}
function announce(sky, samples, halo) {
  $('live').textContent = C.formatSkyCoords(sky.theta, sky.phi) + '. ' + valuesText(samples) + (halo ? '. ' + haloText(halo, true) : '');
}
function cssVar(c) { return C.CSS_VAR[c]; }

/** Click / Enter: one note per voice at the point, plus the nearest halo within the pick radius. */
function listenAt(sky, radiusPx) {
  const samples = samplesAt(sky.theta, sky.phi);
  audio.playPoint(samples);
  const halo = haloAt(sky.theta, sky.phi, radiusPx);
  if (halo) playHaloIdx(halo.index);
  V.ear = sky; V.target = sky; drawOverlay();
  setReadout(sky, samples, halo); announce(sky, samples, halo);
  if (samples.some((s) => s.uK === null)) loadValueMaps();
}

// ------------------------------ scanning ------------------------------
function scanSpacing() { return Math.max(0.5 * C.valueMapResolution(V.meta), C.pickRadiusAngle(SCAN_PX, pxPerRad())); }   // >= half a value pixel
function scanBegin(sky) {
  if (!V.path) V.path = new C.ScanPath(scanSpacing(), SCAN_QUEUE);
  V.path.setSpacing(scanSpacing());
  V.path.start(sky.theta, sky.phi);
  V.target = null; clearTimeout(V.keyTimer);     // a pending throttled key note must not fire during the scan
  audio.scanStart(V.path, orderedComps(), { sample: samplesAt, onSample: onScanSample, onStop: () => { drawOverlay(); } });
  loadValueMaps();
}
function onScanSample(s, samples) {
  V.ear = s; drawOverlay();
  const halo = haloAt(s.theta, s.phi, V.touch ? PICK_PX_TOUCH : PICK_PX);
  if (halo) {        // halo sound when the ear passes a cluster: once per cluster per 2 s, at most one per 150 ms
    const t = performance.now(), last = V.haloLast.get(halo.index) || -1e9;
    if (t - last > 2000 && t - (V.lastEarcon || -1e9) > 150) {
      V.haloLast.set(halo.index, t); V.lastEarcon = t; playHaloIdx(halo.index);
    }
  }
  setReadout(s, samples, halo);
}

// ============================== interaction ==============================
function zoomAt(sx, sy, factor) {
  const ns = Math.min(V.maxScale, Math.max(V.minScale, V.scale * factor));
  const f = ns / V.scale; V.panX = sx - (sx - V.panX) * f; V.panY = sy - (sy - V.panY) * f;
  V.scale = ns; clampView(); draw();
}
function localXY(clientX, clientY) { const r = canvas.getBoundingClientRect(); return [clientX - r.left, clientY - r.top]; }
function pointerDown(x, y, touch) {
  V.dragging = true; V.moved = false; V.lastX = x; V.lastY = y; V.downX = x; V.downY = y; V.touch = touch; V.scanDrag = false;
  if (V.scan) { const [lx, ly] = localXY(x, y); V.scanFrom = screenToSky(lx, ly); }
}
function pointerMove(x, y) {
  if (!V.dragging) return;
  const dx = x - V.lastX, dy = y - V.lastY; V.lastX = x; V.lastY = y;    // per event: panning
  // click vs drag: the TOTAL travel since the press (a slow drag is still a drag)
  if (Math.abs(x - V.downX) + Math.abs(y - V.downY) > (V.touch ? CLICK_SLOP_PX_TOUCH : CLICK_SLOP_PX)) V.moved = true;
  if (V.scan) {
    const [lx, ly] = localXY(x, y), sky = screenToSky(lx, ly);
    if (!sky) return;
    if (!V.scanDrag) {                           // a scan starts with the first real drag movement
      if (!V.moved) return;
      audio.ensure(); scanBegin(V.scanFrom || sky); V.scanDrag = true;
    }
    V.path.push(sky.theta, sky.phi);
  } else { V.panX += dx; V.panY += dy; clampView(); draw(); }
}
function pointerUp() {
  V.dragging = false; canvas.classList.remove('grabbing');
  if (V.scanDrag && V.path) V.path.end();       // the ear finishes the path, then fades out
  V.scanDrag = false;
}
canvas.addEventListener('mousedown', (e) => { canvas.focus({ preventScroll: true }); canvas.classList.add('grabbing'); pointerDown(e.clientX, e.clientY, false); });
window.addEventListener('mousemove', (e) => {
  if (V.dragging && e.buttons === 0) { pointerUp(); return; }   // the button was released where we could not see it
  pointerMove(e.clientX, e.clientY);
});
window.addEventListener('mouseup', pointerUp);
canvas.addEventListener('click', (e) => {
  if (V.moved) return;
  const [x, y] = localXY(e.clientX, e.clientY), sky = screenToSky(x, y);
  if (sky) listenAt(sky, PICK_PX);
});
canvas.addEventListener('wheel', (e) => { e.preventDefault(); const [x, y] = localXY(e.clientX, e.clientY); zoomAt(x, y, e.deltaY < 0 ? 1.15 : 1 / 1.15); }, { passive: false });

let pinchD = 0;
function touchDist(e) { const a = e.touches[0], b = e.touches[1]; return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); }
canvas.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) pointerDown(e.touches[0].clientX, e.touches[0].clientY, true);
  else if (e.touches.length === 2) { V.dragging = false; pinchD = touchDist(e); if (V.path) V.path.end(); }
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchmove', (e) => {
  if (e.touches.length === 1 && V.dragging) pointerMove(e.touches[0].clientX, e.touches[0].clientY);
  else if (e.touches.length === 2) {
    const d = touchDist(e);
    if (pinchD > 0) {
      const [cx, cy] = localXY((e.touches[0].clientX + e.touches[1].clientX) / 2, (e.touches[0].clientY + e.touches[1].clientY) / 2);
      zoomAt(cx, cy, d / pinchD);
    }
    pinchD = d;
  }
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchend', (e) => {
  if (e.touches.length === 0 && V.dragging && !V.moved) {
    const t = e.changedTouches[0], [x, y] = localXY(t.clientX, t.clientY), sky = screenToSky(x, y);
    if (sky) listenAt(sky, PICK_PX_TOUCH);
  }
  pointerUp(); pinchD = 0; e.preventDefault();
}, { passive: false });

// ------------------------------ keyboard (focus the map) ------------------------------
function keepEarVisible(p) {
  const s = skyToScreen(p.theta, p.phi), m = 40;
  const visible = s.xs.some((x) => x >= m && x <= V.cw - m);
  if (!visible) { const x = s.xs.length ? s.xs[0] : 0; V.panX += V.cw / 2 - x; }
  if (s.y < m || s.y > V.ch - m) V.panY += V.ch / 2 - s.y;
  clampView(); draw();
}
canvas.addEventListener('keydown', (e) => {
  const big = e.shiftKey ? 6 : 1, step = big * C.pickRadiusAngle(KEY_STEP_PX, pxPerRad());
  const moves = { ArrowUp: [-step, 0], ArrowDown: [step, 0], ArrowLeft: [0, -step], ArrowRight: [0, step] };
  if (moves[e.key]) {
    e.preventDefault();
    // V.target = where the keyboard has put the ear (the audible ear may still be gliding there)
    const from = V.target || V.ear || screenToSky(V.cw / 2, V.ch / 2) || { theta: Math.PI / 2, phi: Math.PI };
    const to = C.stepOnSphere(from.theta, from.phi, moves[e.key][0], moves[e.key][1]);
    if (V.scan) {
      audio.ensure();
      if (!audio.scanning || !V.path) scanBegin(from); else V.path.inputDone = false;
      V.target = to;
      V.path.push(to.theta, to.phi);
      clearTimeout(V.keyTimer); V.keyTimer = setTimeout(() => {
        if (V.path) V.path.end();
        announce(to, samplesAt(to.theta, to.phi), haloAt(to.theta, to.phi, PICK_PX));
      }, 400);
      drawOverlay();
    } else {
      V.ear = to; V.target = to;
      const now = performance.now();
      clearTimeout(V.keyTimer);
      if (now - V.lastKeyPlay > 150) { V.lastKeyPlay = now; listenAt(to, PICK_PX); }
      else { drawOverlay(); V.keyTimer = setTimeout(() => { if (V.target) listenAt(V.target, PICK_PX); }, 160); }
    }
    keepEarVisible(to);
  } else if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    listenAt(V.target || V.ear || screenToSky(V.cw / 2, V.ch / 2) || { theta: Math.PI / 2, phi: Math.PI }, PICK_PX);
  } else if (e.key === '+' || e.key === '=') { e.preventDefault(); zoomAt(V.cw / 2, V.ch / 2, 1.4); }
  else if (e.key === '-' || e.key === '_') { e.preventDefault(); zoomAt(V.cw / 2, V.ch / 2, 1 / 1.4); }
});

// ============================== controls ==============================
function buildComponentButtons() {
  const g = $('compGroup');
  for (const c of COMPS) {
    if ((V.meta.components || []).indexOf(c) < 0) continue;
    const w = document.createElement('span'); w.className = 'comp';
    const b = document.createElement('button');
    b.className = 'btn comp-btn'; b.dataset.comp = c; b.textContent = C.COMP_LABELS[c];
    b.title = c === 'T_tot' ? 'Total = CMB + tSZ + CIB in the selected band (excludes them; kSZ not included)' : C.COMP_LABELS[c];
    b.addEventListener('click', () => {
      V.comps = C.toggleComponent(V.comps, c);
      refreshComponents();
    });
    const m = document.createElement('button');
    m.className = 'btn mini mute'; m.textContent = 'M'; m.dataset.comp = c; m.setAttribute('aria-label', 'Mute ' + C.COMP_LABELS[c] + ' audio');
    m.addEventListener('click', () => { toggleSet(V.mute, c); applyMuteSolo(); });
    const s = document.createElement('button');
    s.className = 'btn mini solo'; s.textContent = 'S'; s.dataset.comp = c; s.setAttribute('aria-label', 'Solo ' + C.COMP_LABELS[c] + ' audio');
    s.addEventListener('click', () => { toggleSet(V.solo, c); applyMuteSolo(); });
    w.append(b, m, s); g.appendChild(w);
  }
}
function toggleSet(s, c) { if (s.has(c)) s.delete(c); else s.add(c); }
function applyMuteSolo() {
  audio.setMuteSolo(V.mute, V.solo);
  document.querySelectorAll('.btn.mini.mute').forEach((b) => { const on = V.mute.has(b.dataset.comp); b.classList.toggle('active', on); b.setAttribute('aria-pressed', on); });
  document.querySelectorAll('.btn.mini.solo').forEach((b) => { const on = V.solo.has(b.dataset.comp); b.classList.toggle('active', on); b.setAttribute('aria-pressed', on); });
}
function refreshComponents() {
  document.querySelectorAll('.comp-btn').forEach((b) => {
    const on = V.comps.indexOf(b.dataset.comp) >= 0;
    b.classList.toggle('active', on); b.setAttribute('aria-pressed', on);
  });
  ensureLayers(); loadValueMaps(); draw(); updateNote(); renderKey();
  if (audio.scanning) audio.scanSetComps(orderedComps());
}
function buildBandButtons() {
  const g = $('bandGroup'), groups = {};
  for (const b of C.bandList(V.meta)) {
    const name = C.bandGroup(b);
    if (!groups[name]) {
      groups[name] = document.createElement('div'); groups[name].className = 'freq-group';
      groups[name].innerHTML = '<span class="clabel">' + name + '</span>'; g.appendChild(groups[name]);
    }
    const btn = document.createElement('button');
    btn.className = 'btn freq-btn'; btn.dataset.band = String(b); btn.textContent = String(b);
    btn.title = name + ' ' + b + ' GHz';
    btn.addEventListener('click', () => { V.band = String(b); refreshBand(); });
    groups[name].appendChild(btn);
  }
}
function refreshBand() {
  document.querySelectorAll('.freq-btn').forEach((x) => {
    const on = x.dataset.band === V.band; x.classList.toggle('active', on); x.setAttribute('aria-pressed', on);
  });
  updateScales(); ensureLayers(); loadValueMaps(); draw(); updateNote(); renderKey();
}
function setToggle(id, on) { const b = $(id); b.classList.toggle('active', on); b.setAttribute('aria-pressed', on); }
$('zoomIn').addEventListener('click', () => zoomAt(V.cw / 2, V.ch / 2, 1.4));
$('zoomOut').addEventListener('click', () => zoomAt(V.cw / 2, V.ch / 2, 1 / 1.4));
$('zoomReset').addEventListener('click', () => { V.scale = V.minScale; V.panX = (V.cw - V.dispW * V.scale) / 2; clampView(); draw(); });
$('scanBtn').addEventListener('click', () => {
  V.scan = !V.scan; setToggle('scanBtn', V.scan);
  canvas.classList.toggle('scan', V.scan);
  if (V.scan) { audio.ensure(); loadValueMaps(); } else audio.scanStop();
});
$('refBtn').addEventListener('click', () => { const on = !audio.state.ref; audio.setRef(on); setToggle('refBtn', on); renderKey(); });
$('eqBtn').addEventListener('click', () => { const on = !audio.state.eq; audio.setEq(on); setToggle('eqBtn', on); renderKey(); });
$('scaleSel').addEventListener('change', (e) => { V.scaleMode = e.target.value; updateScales(); updateNote(); renderKey(); });
$('haloSel').addEventListener('change', (e) => { audio.setArtistic(e.target.value === 'artistic'); renderKey(); });
$('vol').addEventListener('input', (e) => audio.setVolume(e.target.value / 100));
$('haloRecBtn').addEventListener('click', () => audio.recordClip((st) => {
  const b = $('haloRecBtn');
  if (st === 'recording') { b.innerHTML = '&#9632; recording…'; b.classList.add('active'); }
  else { b.classList.remove('active'); b.innerHTML = st === 'nomic' ? 'no mic' : st === 'denied' ? 'mic denied' : '&#127908; record'; }
  if (st === 'idle') { $('haloSel').value = 'artistic'; audio.setArtistic(true); renderKey(); }
}));
$('keyBtn').addEventListener('click', () => {
  const k = $('key'), open = k.hidden; k.hidden = !open; $('keyBtn').setAttribute('aria-expanded', open);
  setToggle('keyBtn', open); if (open) renderKey();
});
window.addEventListener('resize', resize);

// ============================== text: polarity note + sound key ==============================
function updateNote() {
  $('note').innerHTML = C.noteHTML({ meta: V.meta, band: V.band, comps: V.comps, scaleMode: V.scaleMode });
}
function renderKey() {
  const k = $('key'); if (k.hidden || !V.meta) return;
  k.innerHTML = C.keyHTML({ meta: V.meta, band: V.band, comps: V.comps, scales: V.scales, scaleMode: V.scaleMode,
    ref: audio.state.ref, eq: audio.state.eq, artistic: audio.state.artistic, pickPx: PICK_PX, pickMode: 'angle', scanPx: SCAN_PX,
    controlRate: SkyAudio.CONTROL_RATE, stagger: SkyAudio.STAGGER, maxLagS: SCAN_QUEUE / SkyAudio.CONTROL_RATE, view: 'map' });
}

// ============================== init ==============================
async function init() {
  setHint('loading…');
  try {
    const [a, b] = await Promise.all([fetch('sky_img/sky_img.json'), fetch('halos.json')]);
    if (!a.ok) throw new Error('sky_img.json HTTP ' + a.status);
    V.meta = await a.json();
    if (V.meta.version !== 3) throw new Error('sky_img.json version ' + V.meta.version + ' (need 3: HEALPix value maps)');
    V.halos = b.ok ? await b.json() : null;
    if (V.halos) V.hidx = C.haloIndex(V.halos);
    V.dispW = V.meta.display.width; V.dispH = V.meta.display.height;
    const bands = C.bandList(V.meta).map(String);
    V.band = bands.indexOf('143') >= 0 ? '143' : bands[0];
    V.scaleMode = $('scaleSel').value || C.DEFAULT_SCALE_MODE;
    updateScales();
    V.store = C.createMapStore(V.meta, {     // a failed map is reported once (not per audio tick) and shown in the hint
      base: 'sky_img/', fetch: (u) => fetch(u), inflate: C.inflateStream,
      onLoad: () => updateHint(), onError: () => updateHint(),
    });
    buildComponentButtons(); buildBandButtons();
    resize();
    refreshComponents(); refreshBand(); applyMuteSolo();
    audio.loadStoredClip();
  } catch (err) {
    setHint('Load failed: ' + err.message + (location.protocol === 'file:' ? ' (serve over http, not file://)' : ''));
    $('note').textContent = '';
  }
}
init();
</script>
</body>

<style>

<header>

<div class="controls" role="group" aria-label="Globe controls">

<script>
'use strict';
if (typeof SkyCore === 'undefined' || typeof SkyAudio === 'undefined') {
  document.getElementById('hint').textContent = 'Could not load the page scripts (sonify_core.js, sky_core.js, sky_audio.js).';
  throw new Error('sky page scripts missing');
}
const C = SkyCore;
const audio = SkyAudio.createSkyAudio({ volume: 0.7 });
const COMPS = ['dT_cmblens', 'dT_tsz', 'dT_cib', 'dT_ksz', 'T_tot'];
const DRAW_ORDER = ['dT_cmblens', 'T_tot', 'dT_ksz', 'dT_tsz', 'dT_cib'];
const TEX_W = 2048, TEX_H = 1024;
const SPIN_RAD_PER_S = 2 * Math.PI / 65;      // one turn per 65 s, independent of the frame rate
const PICK_PX = 6, PICK_PX_TOUCH = 14, SCAN_PX = 5, KEY_STEP_PX = 8, SCAN_QUEUE = 60;
const HALO_R = 1.006;                          // marker radius (just above the unit sphere); picking projects the
                                               // markers at this radius, so a click on a drawn dot finds it
const KEEP_VISIBLE_COS = 0.5;                  // keyboard ear: recentre when its view angle exceeds 60 deg (foreshortened)
const KEEP_VISIBLE_MARGIN_PX = 40;             // ... or when it is within this margin of the view's edge
const BIN_SIZE = [0.016, 0.022, 0.029, 0.038]; // marker size per mass bin (C.MASS_BIN_EDGES)
const V = {
  meta: null, halos: null, hidx: null, store: null, scales: null,
  comps: ['dT_cmblens'], band: '143', scaleMode: C.DEFAULT_SCALE_MODE, layers: {}, mute: new Set(), solo: new Set(),
  spin: false, showHalos: true, scan: false, path: null, ear: null, target: null, haloLast: new Map(),
  keyTimer: null, lastKeyPlay: 0, touch: false,
};
const $ = (id) => document.getElementById(id);

// ============================== display layers -> texture canvas ==============================
function displayFiles(comp) {
  const e = C.findMap(V.meta, comp, V.band); if (!e) return null;
  const d = e.display, multi = V.comps.length >= 2;
  return (multi && d.hi_dk) ? { hi: d.hi_dk, lo: d.lo_dk } : { hi: d.hi, lo: d.lo };
}
function layerImg(f) { const L = f && V.layers[f.hi]; return L ? (L.hi || L.lo) : null; }
function ensureLayers() {
  for (const c of V.comps) {
    const f = displayFiles(c); if (!f) continue;
    let L = V.layers[f.hi];
    if (!L) L = V.layers[f.hi] = { lo: null, hi: null, loLoading: false, hiLoading: false };
    if (!L.lo && !L.loLoading) {
      L.loLoading = true;
      const im = new Image(); im.crossOrigin = 'anonymous';
      im.onload = () => { L.lo = im; composite(); loadHi(f, L); updateHint(); };
      im.onerror = () => { L.loLoading = false; };
      im.src = 'sky_img/' + f.lo;
    } else if (!L.hi && !L.hiLoading) loadHi(f, L);
  }
  updateHint();
}
function loadHi(f, L) {
  if (L.hi || L.hiLoading) return;
  L.hiLoading = true;
  const im = new Image(); im.crossOrigin = 'anonymous';
  im.onload = () => { L.hi = im; composite(); };
  im.onerror = () => { L.hiLoading = false; };
  im.src = 'sky_img/' + f.hi;
}
function setHint(t) { if ($('hint').textContent !== t) $('hint').textContent = t; }   // a live region: announce changes only
function updateHint() {
  const missing = V.comps.some((c) => !layerImg(displayFiles(c)));
  const failed = V.comps.map((c) => V.store.error(c, V.band)).find(Boolean);
  const vm = V.comps.some((c) => !V.store.isReady(c, V.band));
  setHint(failed ? 'sky values unavailable: ' + failed.message : missing ? 'loading images…' : vm ? 'loading sky values…' : '');
}
let texCanvas, texCtx, skyTexture;
function composite() {
  if (!texCtx) return;
  texCtx.globalCompositeOperation = 'source-over';
  texCtx.fillStyle = '#04060c'; texCtx.fillRect(0, 0, TEX_W, TEX_H);
  const multi = V.comps.length >= 2;
  for (const c of DRAW_ORDER) {
    if (V.comps.indexOf(c) < 0) continue;
    const img = layerImg(displayFiles(c)); if (!img) continue;
    texCtx.globalCompositeOperation = multi ? 'lighten' : 'source-over';
    texCtx.drawImage(img, 0, 0, TEX_W, TEX_H);   // row 0 = theta 0 -> +y (CanvasTexture flipY = true)
  }
  texCtx.globalCompositeOperation = 'source-over';
  if (skyTexture) skyTexture.needsUpdate = true;
}

// ============================== Three.js scene ==============================
// skyGroup holds the sphere, the halo markers and the ear marker, so they rotate together.
// Every sky <-> 3D conversion goes through SkyCore.skyToVec / vecToSky in skyGroup's LOCAL frame
// (the three.js r128 SphereGeometry convention: theta = 0 at +y).
let scene, camera, renderer, controls, skyGroup, sphere, haloGroup, earMarker, raycaster;
function localToWorld(theta, phi, r) { return skyGroup.localToWorld(new THREE.Vector3(...C.skyToVec(theta, phi, r || 1))); }
function worldToSky(p) { const l = skyGroup.worldToLocal(p.clone()); return C.vecToSky(l.x, l.y, l.z); }
function viewSize() { const v = $('view'); return [v.clientWidth, v.clientHeight]; }
function toScreen(theta, phi) {
  const [w, h] = viewSize(), v = localToWorld(theta, phi, 1).project(camera);
  return [(v.x + 1) / 2 * w, (1 - v.y) / 2 * h];
}
/** Local screen scale [CSS px per radian] at a sky point: the larger of the two tangent directions
 *  (the other one is foreshortened towards the limb). */
function pxPerRadAt(sky) {
  const d = 0.004, p0 = toScreen(sky.theta, sky.phi);
  const p1 = toScreen(sky.theta + d, sky.phi), p2 = toScreen(sky.theta, sky.phi + d / Math.max(0.02, Math.sin(sky.theta)));
  return Math.max(Math.hypot(p1[0] - p0[0], p1[1] - p0[1]), Math.hypot(p2[0] - p0[0], p2[1] - p0[1])) / d;
}
/** Sky point under a client position, or null (misses the globe). Uses the exact ray-sphere hit,
 *  converted with vecToSky (consistent with the marker positions). */
function pick(clientX, clientY) {
  const r = renderer.domElement.getBoundingClientRect();
  const m = new THREE.Vector2(((clientX - r.left) / r.width) * 2 - 1, -((clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(m, camera);
  const hit = raycaster.intersectObject(sphere)[0];
  return hit ? worldToSky(hit.point) : null;
}
// ---- halo picking in SCREEN space (CSS px), against the markers as they are drawn ----
// Every matrix is the one of the last rendered frame (what the user sees), or refreshed right
// after a keyboard camera move (refreshView).
const _M = new THREE.Matrix4(), _P = new THREE.Vector3(), _CL = new THREE.Vector3();
/** The camera position in skyGroup's local frame. */
function cameraLocal() { return skyGroup.worldToLocal(_CL.setFromMatrixPosition(camera.matrixWorld)); }
/** Is the local point (px, py, pz) visible from the local camera position cl, i.e. the sight line
 *  does not cross the unit sphere first? (Markers at HALO_R just beyond the limb are visible.) */
function visibleFrom(cl, px, py, pz) {
  const dx = px - cl.x, dy = py - cl.y, dz = pz - cl.z;
  const a = dx * dx + dy * dy + dz * dz, b = cl.x * dx + cl.y * dy + cl.z * dz, c = cl.lengthSq() - 1;
  const disc = b * b - a * c;
  if (disc <= 0) return true;                                   // the sight line misses the sphere
  const t1 = (-b - Math.sqrt(disc)) / a;                        // first crossing (the camera is outside)
  return !(t1 > 0 && t1 < 1 - 1e-7);
}
/** The visible halo whose marker, projected at radius r with the camera, is nearest to the canvas
 *  point (x, y) [CSS px], within radiusPx; null if none, or if the clusters are hidden. r = HALO_R
 *  for clicks (where the dots are drawn); 1 for a point on the sky (the ear). */
function haloNearScreen(x, y, radiusPx, r) {
  if (!V.hidx || !V.showHalos) return null;                     // hidden clusters are silent
  const [w, h] = viewSize(), vec = V.hidx.vec, cl = cameraLocal();
  _M.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse).multiply(skyGroup.matrixWorld);
  let best = -1, bestD2 = radiusPx * radiusPx;
  for (let i = 0; i < V.hidx.n; i++) {
    const px = r * vec[3 * i], py = r * vec[3 * i + 1], pz = r * vec[3 * i + 2];
    if (!visibleFrom(cl, px, py, pz)) continue;
    _P.set(px, py, pz).applyMatrix4(_M);
    const dx = (_P.x + 1) / 2 * w - x, dy = (1 - _P.y) / 2 * h - y, d2 = dx * dx + dy * dy;
    if (d2 <= bestD2) { bestD2 = d2; best = i; }
  }
  return best < 0 ? null : { index: best, px: Math.sqrt(bestD2) };
}
function haloSky(i) { return { theta: V.halos.theta[i] * C.DEG, phi: V.halos.phi[i] * C.DEG }; }
/** Adds the great-circle distance [rad] from sky to the picked halo (for the readout). */
function withDist(hp, sky) {
  if (!hp) return null;
  const q = haloSky(hp.index); hp.dist = C.angDist(sky.theta, sky.phi, q.theta, q.phi); return hp;
}
/** The halo at a sky point (the scan ear, a keyboard position): the point and the halo positions,
 *  both on the unit sphere, compared on screen within radiusPx. Behind the globe (not visible):
 *  great-circle distance with the local screen scale. */
function haloAt(sky, radiusPx) {
  if (!V.hidx || !V.showHalos) return null;
  const n = C.skyToVec(sky.theta, sky.phi, 1), cl = cameraLocal();
  if (n[0] * cl.x + n[1] * cl.y + n[2] * cl.z > 1) {
    const [x, y] = toScreen(sky.theta, sky.phi);
    return withDist(haloNearScreen(x, y, radiusPx, 1), sky);
  }
  return C.pickHalo(V.hidx, sky.theta, sky.phi, C.pickRadiusAngle(radiusPx, pxPerRadAt(sky)));
}
/** A click (client coordinates): the marker under it (screen space, at the radius it is drawn)
 *  and the sky point under it; a marker just beyond the limb still counts (its own position). */
function clickAt(clientX, clientY, radiusPx) {
  const r = renderer.domElement.getBoundingClientRect();
  let sky = pick(clientX, clientY);
  const hp = haloNearScreen(clientX - r.left, clientY - r.top, radiusPx, HALO_R);
  if (!sky && hp) sky = haloSky(hp.index);
  if (sky) listenAt(sky, radiusPx, withDist(hp, sky));
}
/** After a programmatic camera move: update the controls and the matrices used for picking. */
function refreshView() { controls.update(); camera.updateMatrixWorld(); }
/** Keyboard navigation: when the ear would leave the view or sit on the foreshortened limb (view
 *  angle > 60 deg), turn the camera about the globe's centre (same distance) to face it. */
function keepEarVisible(sky) {
  const n = C.skyToVec(sky.theta, sky.phi, 1), cl = cameraLocal();
  const dx = cl.x - n[0], dy = cl.y - n[1], dz = cl.z - n[2];
  const cosView = (n[0] * dx + n[1] * dy + n[2] * dz) / Math.hypot(dx, dy, dz);
  const [w, h] = viewSize(), [x, y] = toScreen(sky.theta, sky.phi), m = KEEP_VISIBLE_MARGIN_PX;
  if (cosView >= KEEP_VISIBLE_COS && x >= m && x <= w - m && y >= m && y <= h - m) return false;
  const d = camera.position.length();
  camera.position.copy(localToWorld(sky.theta, sky.phi, 1).normalize().multiplyScalar(d));
  refreshView();
  return true;
}
function initThree() {
  const view = $('view'), [w, h] = viewSize();
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(45, w / h, 0.01, 100);
  camera.position.set(0, 0, 2.8);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h); renderer.setClearColor(0x05060c, 1);
  const cv = renderer.domElement;
  cv.tabIndex = 0; cv.setAttribute('role', 'application'); cv.style.touchAction = 'none';
  cv.setAttribute('aria-label', 'Sky globe. Arrow keys move the listening point (up = north, Shift for bigger steps), Enter or Space plays it, plus and minus zoom.');
  view.insertBefore(cv, view.firstChild);

  texCanvas = document.createElement('canvas'); texCanvas.width = TEX_W; texCanvas.height = TEX_H;
  texCtx = texCanvas.getContext('2d');
  texCtx.fillStyle = '#04060c'; texCtx.fillRect(0, 0, TEX_W, TEX_H);
  skyTexture = new THREE.CanvasTexture(texCanvas);
  skyGroup = new THREE.Group(); scene.add(skyGroup);
  sphere = new THREE.Mesh(new THREE.SphereGeometry(1, 192, 96), new THREE.MeshBasicMaterial({ map: skyTexture }));
  skyGroup.add(sphere);
  earMarker = new THREE.Mesh(new THREE.RingGeometry(0.009, 0.015, 32),
    new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide }));
  earMarker.visible = false; skyGroup.add(earMarker);

  controls = new THREE.OrbitControls(camera, cv);
  controls.enablePan = false; controls.rotateSpeed = 0.5; controls.minDistance = 1.25; controls.maxDistance = 6;
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  raycaster = new THREE.Raycaster();

  let downX = 0, downY = 0;
  /** End a press; in Scan mode the ear finishes the path and fades out. Returns whether it was a scan drag. */
  const endPress = () => {
    const wasScan = V.scanDrag; V.pointerDown = false; V.scanDrag = false;
    if (wasScan && V.path) V.path.end();
    return wasScan;
  };
  cv.addEventListener('pointerdown', (e) => {
    downX = e.clientX; downY = e.clientY; V.touch = e.pointerType === 'touch'; cv.focus({ preventScroll: true });
    V.pointerDown = true; V.scanDrag = false;
    if (V.scan) {
      // capture the pointer: the release ends the scan even over the toolbar or outside the window
      try { cv.setPointerCapture(e.pointerId); } catch (err) { /* no capture: the window listener below */ }
      V.scanFrom = pick(e.clientX, e.clientY);
    }
  });
  cv.addEventListener('pointermove', (e) => {
    if (!V.scan || !V.pointerDown) return;
    if (e.buttons === 0) { endPress(); return; }            // released where we could not see it: a hover is not a drag
    if (!V.scanDrag && Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) <= 6) return;
    const sky = pick(e.clientX, e.clientY); if (!sky) return;
    if (!V.scanDrag) { audio.ensure(); scanBegin(V.scanFrom || sky); V.scanDrag = true; }
    V.path.push(sky.theta, sky.phi);
  });
  cv.addEventListener('pointerup', (e) => {
    if (!V.pointerDown) return;
    if (endPress()) return;
    if (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) > 6) return;   // was a drag (rotate)
    clickAt(e.clientX, e.clientY, V.touch ? PICK_PX_TOUCH : PICK_PX);
  });
  // a release outside the canvas (no pointer capture) or a lost capture also ends the press
  window.addEventListener('pointerup', () => { if (V.pointerDown) endPress(); });
  cv.addEventListener('lostpointercapture', () => { if (V.pointerDown) endPress(); });
  cv.addEventListener('pointercancel', endPress);
  cv.addEventListener('keydown', onKey);
  window.addEventListener('resize', onResize);
}
function onResize() {
  const [w, h] = viewSize();
  camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h);
}
function dotTexture() {   // round dot with gentle shading (tinted per point)
  const s = 64, c = document.createElement('canvas'); c.width = c.height = s; const x = c.getContext('2d');
  const g = x.createRadialGradient(s * 0.40, s * 0.40, 1, s / 2, s / 2, s / 2);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.75, 'rgba(228,228,228,1)');
  g.addColorStop(0.92, 'rgba(195,195,195,1)'); g.addColorStop(0.98, 'rgba(195,195,195,0)'); g.addColorStop(1, 'rgba(195,195,195,0)');
  x.fillStyle = g; x.beginPath(); x.arc(s / 2, s / 2, s / 2, 0, 2 * Math.PI); x.fill();
  return new THREE.CanvasTexture(c);
}
/** Halo markers: size by mass bin (as in the flat map, bigger = more massive), brightness by mass. */
function buildHalos() {
  if (!V.halos) return;
  const H = V.halos, tex = dotTexture(), bins = [[], [], [], []];
  for (let i = 0; i < H.n; i++) bins[C.massBin(H.log_mass[i])].push(i);
  haloGroup = new THREE.Group(); skyGroup.add(haloGroup);
  bins.forEach((idx, b) => {
    if (!idx.length) return;
    const pos = new Float32Array(idx.length * 3), col = new Float32Array(idx.length * 3);
    idx.forEach((i, k) => {
      const v = C.skyToVec(H.theta[i] * C.DEG, H.phi[i] * C.DEG, HALO_R);
      pos.set(v, 3 * k);
      const br = Math.min(1, Math.max(0.35, (H.log_mass[i] - 14.5) * 0.9 + 0.35));
      col.set([1.0 * br, 0.84 * br, 0.5 * br], 3 * k);
    });
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const m = new THREE.PointsMaterial({ size: BIN_SIZE[b], map: tex, sizeAttenuation: true, vertexColors: true, alphaTest: 0.5 });
    haloGroup.add(new THREE.Points(g, m));
  });
}
function placeEar(sky) {
  if (!sky) { earMarker.visible = false; return; }
  const n = new THREE.Vector3(...C.skyToVec(sky.theta, sky.phi, 1));
  earMarker.position.copy(n).multiplyScalar(1.003);
  earMarker.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), n);
  earMarker.visible = true;
}

// ============================== audio ==============================
function orderedComps() { return C.VOICE_ORDER.filter((c) => V.comps.indexOf(c) >= 0); }
/** One voice sample per active component (SkyCore.voiceSample): uK = the value (null until its map
 *  is loaded), with the pitch centre/scales of the current Scale mode and band. */
function samplesAt(theta, phi) {
  return orderedComps().map((c) => {
    const m = V.store.get(c, V.band);
    return C.voiceSample(c, m ? C.sampleMap(m, theta, phi) : null, C.findMap(V.meta, c, V.band), V.scales[c]);
  });
}
function updateScales() { V.scales = C.scaleTable(V.meta, V.band, V.scaleMode); }
function valueText(s) {
  return s.uK !== null ? C.formatMicroK(s.uK, s.step) : V.store.error(s.comp, V.band) ? '(unavailable)' : '(loading)';
}
function loadValueMaps() { for (const c of V.comps) V.store.get(c, V.band); }
function worldArr(theta, phi) { const p = localToWorld(theta, phi, 1); return [p.x, p.y, p.z]; }
function haloText(p, verbose) {
  const H = V.halos, i = p.index;
  const s = 'cluster: log₁₀ M₂₀₀c = ' + H.log_mass[i].toFixed(2) + ' (M⊙/h), z = ' + H.redshift[i].toFixed(2) +
    (H.chi ? ', χ = ' + Math.round(H.chi[i]) + ' Mpc/h' : '');
  return verbose ? s + ', ' + (p.dist / C.DEG * 60).toFixed(1) + ' arcmin away' : s;
}
function playHaloIdx(i) {
  const H = V.halos;
  audio.playHalo({ logM: H.log_mass[i], chi: H.chi ? H.chi[i] : C.comovingDistance(H.redshift[i]) },
    { position: worldArr(H.theta[i] * C.DEG, H.phi[i] * C.DEG) });   // HRTF direction; 1/chi level from the cue
}
function setReadout(sky, samples, halo) {
  let html = C.formatSkyCoords(sky.theta, sky.phi) + ' &nbsp;|&nbsp; ' +
    samples.map((s) => '<b style="color:var(--' + C.CSS_VAR[s.comp] + ')">' + C.COMP_LABELS[s.comp] + '</b> ' +
      (s.uK === null ? '&hellip;' : C.formatMicroK(s.uK, s.step))).join(' &nbsp; ');
  if (halo) html += ' &nbsp;|&nbsp; <span style="color:#ffd58a">&#9679; ' + haloText(halo, false) + '</span>';
  $('readout').innerHTML = html;
}
function announce(sky, samples, halo) {
  $('live').textContent = C.formatSkyCoords(sky.theta, sky.phi) + '. ' +
    samples.map((s) => C.COMP_LABELS[s.comp] + ' ' + valueText(s)).join(', ') +
    (halo ? '. ' + haloText(halo, true) : '');
}
/** Play the point and the cluster there. halo: the cluster already picked (a click, in screen
 *  space), or undefined to pick around the point (keyboard). */
function listenAt(sky, radiusPx, halo) {
  const samples = samplesAt(sky.theta, sky.phi);
  audio.playPoint(samples, { position: worldArr(sky.theta, sky.phi) });
  if (halo === undefined) halo = haloAt(sky, radiusPx);
  if (halo) playHaloIdx(halo.index);
  V.ear = sky; V.target = sky; placeEar(sky);
  setReadout(sky, samples, halo); announce(sky, samples, halo);
  if (samples.some((s) => s.uK === null)) loadValueMaps();
}
function scanBegin(sky) {
  const spacing = Math.max(0.5 * C.valueMapResolution(V.meta), C.pickRadiusAngle(SCAN_PX, pxPerRadAt(sky)));   // >= half a value pixel
  if (!V.path) V.path = new C.ScanPath(spacing, SCAN_QUEUE);
  clearTimeout(V.keyTimer);                     // a pending throttled key note must not fire during the scan
  V.path.setSpacing(spacing); V.path.start(sky.theta, sky.phi); V.target = null;
  audio.scanStart(V.path, orderedComps(), { sample: samplesAt, onSample: onScanSample, position: worldArr });
  loadValueMaps();
}
function onScanSample(s, samples) {
  V.ear = s; placeEar(s);
  const halo = haloAt(s, V.touch ? PICK_PX_TOUCH : PICK_PX);
  if (halo) {        // halo sound when the ear passes a cluster: once per cluster per 2 s, at most one per 150 ms
    const t = performance.now(), last = V.haloLast.get(halo.index) || -1e9;
    if (t - last > 2000 && t - (V.lastEarcon || -1e9) > 150) {
      V.haloLast.set(halo.index, t); V.lastEarcon = t; playHaloIdx(halo.index);
    }
  }
  setReadout(s, samples, halo);
}
function onKey(e) {
  const centre = () => { const r = renderer.domElement.getBoundingClientRect(); return pick(r.left + r.width / 2, r.top + r.height / 2); };
  const moves = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
  if (moves[e.key]) {
    e.preventDefault();
    const from = V.target || V.ear || centre() || { theta: Math.PI / 2, phi: Math.PI / 2 };
    const step = (e.shiftKey ? 6 : 1) * C.pickRadiusAngle(KEY_STEP_PX, pxPerRadAt(from));
    const to = C.stepOnSphere(from.theta, from.phi, moves[e.key][0] * step,
      moves[e.key][1] * step / Math.max(0.05, Math.sin(from.theta)));     // east-west step of the same angle
    keepEarVisible(to);                                                    // turn the globe view to follow the ear
    if (V.scan) {
      audio.ensure();
      if (!audio.scanning || !V.path) scanBegin(from); else V.path.inputDone = false;
      V.target = to; V.path.push(to.theta, to.phi);
      clearTimeout(V.keyTimer); V.keyTimer = setTimeout(() => {
        if (V.path) V.path.end();
        announce(to, samplesAt(to.theta, to.phi), haloAt(to, PICK_PX));
      }, 400);
    } else {
      V.ear = to; V.target = to; placeEar(to);
      const now = performance.now();
      clearTimeout(V.keyTimer);
      if (now - V.lastKeyPlay > 150) { V.lastKeyPlay = now; listenAt(to, PICK_PX); }
      else V.keyTimer = setTimeout(() => { if (V.target) listenAt(V.target, PICK_PX); }, 160);
    }
  } else if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    const p = V.target || V.ear || centre(); if (p) { keepEarVisible(p); listenAt(p, PICK_PX); }
  } else if (e.key === '+' || e.key === '=' || e.key === '-' || e.key === '_') {
    e.preventDefault();
    const f = (e.key === '+' || e.key === '=') ? 1 / 1.2 : 1.2;
    const d = Math.min(controls.maxDistance, Math.max(controls.minDistance, camera.position.length() * f));
    camera.position.setLength(d); refreshView();
  }
}

// ============================== animation (frame-rate independent) ==============================
let lastT = null;
const tmpF = new THREE.Vector3(), tmpU = new THREE.Vector3();
function animate(t) {
  requestAnimationFrame(animate);
  const dt = lastT === null ? 0 : Math.min(0.1, (t - lastT) / 1000); lastT = t;
  if (V.spin) skyGroup.rotation.y += SPIN_RAD_PER_S * dt;
  controls.dampingFactor = 1 - Math.pow(1 - 0.08, dt * 60);   // the 0.08-per-frame-at-60-Hz damping, per second
  controls.enableRotate = !V.scan;
  controls.update();
  if (audio.ctx) {                                             // listener = the camera (HRTF)
    camera.getWorldDirection(tmpF); tmpU.set(0, 1, 0).applyQuaternion(camera.quaternion);
    audio.setListener([camera.position.x, camera.position.y, camera.position.z], [tmpF.x, tmpF.y, tmpF.z], [tmpU.x, tmpU.y, tmpU.z]);
  }
  renderer.render(scene, camera);
}

// ============================== controls ==============================
function toggleSet(s, c) { if (s.has(c)) s.delete(c); else s.add(c); }
function setToggle(id, on) { const b = $(id); b.classList.toggle('active', on); b.setAttribute('aria-pressed', on); }
function buildComponentButtons() {
  const g = $('compGroup');
  for (const c of COMPS) {
    if ((V.meta.components || []).indexOf(c) < 0) continue;
    const w = document.createElement('span'); w.className = 'comp';
    const b = document.createElement('button');
    b.className = 'btn comp-btn'; b.dataset.comp = c; b.textContent = C.COMP_LABELS[c];
    b.title = c === 'T_tot' ? 'Total = CMB + tSZ + CIB in the selected band (excludes them; kSZ not included)' : C.COMP_LABELS[c];
    b.addEventListener('click', () => { V.comps = C.toggleComponent(V.comps, c); refreshComponents(); });
    const m = document.createElement('button');
    m.className = 'btn mini mute'; m.textContent = 'M'; m.dataset.comp = c; m.setAttribute('aria-label', 'Mute ' + C.COMP_LABELS[c] + ' audio');
    m.addEventListener('click', () => { toggleSet(V.mute, c); applyMuteSolo(); });
    const s = document.createElement('button');
    s.className = 'btn mini solo'; s.textContent = 'S'; s.dataset.comp = c; s.setAttribute('aria-label', 'Solo ' + C.COMP_LABELS[c] + ' audio');
    s.addEventListener('click', () => { toggleSet(V.solo, c); applyMuteSolo(); });
    w.append(b, m, s); g.appendChild(w);
  }
}
function applyMuteSolo() {
  audio.setMuteSolo(V.mute, V.solo);
  document.querySelectorAll('.btn.mini.mute').forEach((b) => { const on = V.mute.has(b.dataset.comp); b.classList.toggle('active', on); b.setAttribute('aria-pressed', on); });
  document.querySelectorAll('.btn.mini.solo').forEach((b) => { const on = V.solo.has(b.dataset.comp); b.classList.toggle('active', on); b.setAttribute('aria-pressed', on); });
}
function refreshComponents() {
  document.querySelectorAll('.comp-btn').forEach((b) => {
    const on = V.comps.indexOf(b.dataset.comp) >= 0; b.classList.toggle('active', on); b.setAttribute('aria-pressed', on);
  });
  ensureLayers(); loadValueMaps(); composite(); updateNote(); renderKey();
  if (audio.scanning) audio.scanSetComps(orderedComps());
}
function buildBandButtons() {
  const g = $('bandGroup'), groups = {};
  for (const b of C.bandList(V.meta)) {
    const name = C.bandGroup(b);
    if (!groups[name]) {
      groups[name] = document.createElement('div'); groups[name].className = 'freq-group';
      groups[name].innerHTML = '<span class="clabel">' + name + '</span>'; g.appendChild(groups[name]);
    }
    const btn = document.createElement('button');
    btn.className = 'btn freq-btn'; btn.dataset.band = String(b); btn.textContent = String(b); btn.title = name + ' ' + b + ' GHz';
    btn.addEventListener('click', () => { V.band = String(b); refreshBand(); });
    groups[name].appendChild(btn);
  }
}
function refreshBand() {
  document.querySelectorAll('.freq-btn').forEach((x) => {
    const on = x.dataset.band === V.band; x.classList.toggle('active', on); x.setAttribute('aria-pressed', on);
  });
  updateScales(); ensureLayers(); loadValueMaps(); composite(); updateNote(); renderKey();
}
function updateNote() { $('note').innerHTML = C.noteHTML({ meta: V.meta, band: V.band, comps: V.comps, scaleMode: V.scaleMode }); }
function renderKey() {
  const k = $('key'); if (k.hidden || !V.meta) return;
  k.innerHTML = C.keyHTML({ meta: V.meta, band: V.band, comps: V.comps, scales: V.scales, scaleMode: V.scaleMode,
    ref: audio.state.ref, eq: audio.state.eq, artistic: audio.state.artistic, pickPx: PICK_PX, pickMode: 'screen', scanPx: SCAN_PX,
    controlRate: SkyAudio.CONTROL_RATE, stagger: SkyAudio.STAGGER, maxLagS: SCAN_QUEUE / SkyAudio.CONTROL_RATE, view: 'globe' });
}
function wireControls() {
  $('spinBtn').addEventListener('click', () => { V.spin = !V.spin; setToggle('spinBtn', V.spin); });
  $('haloBtn').addEventListener('click', () => {
    V.showHalos = !V.showHalos; if (haloGroup) haloGroup.visible = V.showHalos;
    $('haloBtn').textContent = 'Clusters: ' + (V.showHalos ? 'on' : 'off'); setToggle('haloBtn', V.showHalos);
  });
  $('scanBtn').addEventListener('click', () => {
    V.scan = !V.scan; setToggle('scanBtn', V.scan);
    if (V.scan) { audio.ensure(); loadValueMaps(); } else audio.scanStop();
  });
  $('refBtn').addEventListener('click', () => { const on = !audio.state.ref; audio.setRef(on); setToggle('refBtn', on); renderKey(); });
  $('eqBtn').addEventListener('click', () => { const on = !audio.state.eq; audio.setEq(on); setToggle('eqBtn', on); renderKey(); });
  $('scaleSel').addEventListener('change', (e) => { V.scaleMode = e.target.value; updateScales(); updateNote(); renderKey(); });
  $('haloSel').addEventListener('change', (e) => { audio.setArtistic(e.target.value === 'artistic'); renderKey(); });
  $('vol').addEventListener('input', (e) => audio.setVolume(e.target.value / 100));
  $('haloRecBtn').addEventListener('click', () => audio.recordClip((st) => {
    const b = $('haloRecBtn');
    if (st === 'recording') { b.innerHTML = '&#9632; recording…'; b.classList.add('active'); }
    else { b.classList.remove('active'); b.innerHTML = st === 'nomic' ? 'no mic' : st === 'denied' ? 'mic denied' : '&#127908; record'; }
    if (st === 'idle') { $('haloSel').value = 'artistic'; audio.setArtistic(true); renderKey(); }
  }));
  $('keyBtn').addEventListener('click', () => {
    const k = $('key'), open = k.hidden; k.hidden = !open; $('keyBtn').setAttribute('aria-expanded', open);
    setToggle('keyBtn', open); if (open) renderKey();
  });
}

async function init() {
  if (typeof THREE === 'undefined') { setHint('Could not load the 3D library (check the connection).'); return; }
  try {
    const [a, b] = await Promise.all([fetch('sky_img/sky_img.json'), fetch('halos.json')]);
    if (!a.ok) throw new Error('sky_img.json HTTP ' + a.status);
    V.meta = await a.json();
    if (V.meta.version !== 3) throw new Error('sky_img.json version ' + V.meta.version + ' (need 3: HEALPix value maps)');
    V.halos = b.ok ? await b.json() : null;
    if (V.halos) V.hidx = C.haloIndex(V.halos);
  } catch (err) {
    setHint('Load failed: ' + err.message + (location.protocol === 'file:' ? ' (serve over http)' : ''));
    $('note').textContent = ''; return;
  }
  const bands = C.bandList(V.meta).map(String);
  V.band = bands.indexOf('143') >= 0 ? '143' : bands[0];
  V.scaleMode = $('scaleSel').value || C.DEFAULT_SCALE_MODE;
  updateScales();
  V.store = C.createMapStore(V.meta, { base: 'sky_img/', fetch: (u) => fetch(u), inflate: C.inflateStream,   // failures reported once
    onLoad: () => updateHint(), onError: () => updateHint() });
  initThree(); buildHalos(); buildComponentButtons(); buildBandButtons(); wireControls();
  refreshComponents(); refreshBand(); applyMuteSolo();
  audio.loadStoredClip();
  requestAnimationFrame(animate);
}
init();
</script>
</body>
</html>
